<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Kiosk QR - Premium minimal kiosk katalog deneyimi" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kiosk QR" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Kiosk QR - Katalog</title>
</head>

<body>
  <!-- Splash Loading Screen -->
  <div id="splash-screen" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  ">
    <div style="width: 80px; height: 80px;">
      <svg viewBox="0 0 80 80" style="animation: splash-spin 1.2s linear infinite;">
        <circle cx="40" cy="40" r="36" fill="none" stroke="#e5e7eb" stroke-width="2" />
        <circle cx="40" cy="40" r="36" fill="none" stroke="#000000" stroke-width="2"
          stroke-dasharray="80 180" stroke-linecap="round" />
      </svg>
    </div>
  </div>
  <style>
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
